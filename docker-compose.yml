networks:
  default:
    name: session-memory_default
services:
  api:
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 2
    container_name: session_memory_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "24.0"
          memory: 16G
        reservations:
          cpus: '0.5'
          memory: 512M
    env_file:
    - .env
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 90s
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8000/health
      timeout: 10s
    image: session-memory-api
    ports:
    - 8000:8000
    restart: unless-stopped
    volumes:
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./data/models:/models
    - ./logs:/app/logs
    - ./data/memory:/app/data/memory
    - ./data/hf_cache:/app/data/hf_cache
    - ./data/collector-spool:/app/data/collector-spool
  backfill_disabled:
    command: python /app/scripts/backfill_embeddings.py
    container_name: session_memory_backfill
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "24.0"
          memory: 8G
        reservations:
          cpus: "2.0"
          memory: 1G
    env_file:
    - .env
    environment:
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    - BACKFILL_MAX=220000
    image: session-memory-api
    restart: 'no'
    profiles:
      - disabled
    volumes:
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./data/models:/models
    - ./logs:/app/logs
  grafana:
    container_name: session_memory_grafana
    depends_on:
    - prometheus
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=admin
    - GF_USERS_ALLOW_SIGN_UP=false
    image: grafana/grafana:latest
    ports:
    - 3000:3000
    restart: unless-stopped
    volumes:
    - ./data/grafana:/var/lib/grafana
    - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards
  postgres:
    container_name: session_memory_postgres
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 512M
    environment:
      POSTGRES_DB: session_memory
      POSTGRES_INITDB_ARGS: -E UTF8 --locale=C
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U postgres
      timeout: 5s
    image: pgvector/pgvector:pg16
    shm_size: 2gb
    ports:
    - 5432:5432
    restart: unless-stopped
    volumes:
    - ./data/postgres:/var/lib/postgresql/data
    - ./backups:/backups
  prometheus:
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    - --storage.tsdb.retention.size=5GB
    container_name: session_memory_prometheus
    depends_on:
    - api
    image: prom/prometheus:latest
    ports:
    - 9090:9090
    restart: unless-stopped
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./monitoring/session-memory-alerts.yml:/etc/prometheus/session-memory-alerts.yml
    - ./data/prometheus:/prometheus
  pyramid-worker:
    command: python /app/scripts/pyramid_worker.py
    container_name: session_memory_pyramid
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "24.0"
          memory: 8G
        reservations:
          cpus: '0.25'
          memory: 256M
    env_file:
    - .env
    environment:
    - PYTHONPATH=/app
    - PYTHONUNBUFFERED=1
    image: session-memory-api
    restart: unless-stopped
    volumes:
    - ./src:/app/src
    - ./scripts:/app/scripts
    - ./data/models:/models
  redis:
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    container_name: session_memory_redis
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 8G
        reservations:
          cpus: '0.25'
          memory: 256M
    expose:
    - 6379
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
    - ./data/redis:/data
volumes:
  grafana_data: null
  postgres_data: null
  prometheus_data: null
  redis_data: null
