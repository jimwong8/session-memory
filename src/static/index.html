<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Session Memory 统一仪表盘</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.status-ok{color:#16a34a;background:#f0fdf4}.status-warn{color:#ca8a04;background:#fef9c3}.status-err{color:#dc2626;background:#fef2f2}
.card{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:12px}
.bar{height:20px;border-radius:4px;transition:width .5s}
.tab-btn{padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;border:none;background:#f1f5f9;color:#64748b}
.tab-btn.active{background:#fff;color:#1e293b;font-weight:600;box-shadow:0 -2px 8px rgba(0,0,0,.05)}
.tab-panel{display:none}.tab-panel.active{display:block}
</style>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-7xl mx-auto px-4 py-4">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-2xl font-bold text-gray-800">Session Memory 统一仪表盘</h1>
    <div class="flex items-center gap-3 text-sm text-gray-500">
      <span id="updateTime">加载中...</span>
      <label class="flex items-center gap-1"><input type="checkbox" id="autoRefresh" checked onchange="toggleRefresh()"> 自动刷新</label>
      <button onclick="loadAll()" class="px-3 py-1 bg-blue-500 text-white rounded-lg hover:bg-blue-600 text-xs">刷新</button>
    </div>
  </div>

  <!-- Tab Navigation -->
  <div class="flex gap-1 mb-0" id="tabNav">
    <button class="tab-btn active" onclick="switchTab('overview')">总览</button>
    <button class="tab-btn" onclick="switchTab('kg')">KG 运维</button>
    <button class="tab-btn" onclick="switchTab('sessions')">会话</button>
    <button class="tab-btn" onclick="switchTab('memory')">记忆</button>
    <button class="tab-btn" onclick="switchTab('search')">搜索</button>
    <button class="tab-btn" onclick="switchTab('llm')">LLM</button>
    <button class="tab-btn" onclick="switchTab('events')">事件</button>
  </div>

  <!-- Tab: Overview -->
  <div id="tab-overview" class="tab-panel active pt-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3" id="healthCards"></div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3">
      <div class="card" id="embeddingPanel"></div>
      <div class="card" id="backfillPanel"></div>
    </div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3" id="quickStats"></div>
  </div>

  <!-- Tab: KG -->
  <div id="tab-kg" class="tab-panel pt-4">
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3" id="kgStats"></div>
    <div class="card mb-3" id="kgActions"></div>
    <div class="card" id="kgQuality"></div>
  </div>

  <!-- Tab: Sessions -->
  <div id="tab-sessions" class="tab-panel pt-4">
    <div class="card mb-3" id="sessionsPanel">加载中...</div>
  </div>

  <!-- Tab: Memory -->
  <div id="tab-memory" class="tab-panel pt-4">
    <div class="card mb-3" id="memoryPanel">加载中...</div>
  </div>

  <!-- Tab: Search -->
  <div id="tab-search" class="tab-panel pt-4">
    <div class="card mb-3" id="searchPanel">
      <h3 class="font-semibold mb-2">全局搜索</h3>
      <div class="flex gap-2 mb-3"><input id="searchQuery" class="flex-1 border rounded-lg px-3 py-2" placeholder="输入搜索词..."><button onclick="doSearch()" class="px-4 py-2 bg-blue-500 text-white rounded-lg">搜索</button></div>
      <div id="searchResults"></div>
    </div>
  </div>

  <!-- Tab: LLM -->
  <div id="tab-llm" class="tab-panel pt-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-3" id="llmPanels"></div>
  </div>

  <!-- Tab: Events -->
  <div id="tab-events" class="tab-panel pt-4">
    <div class="card" id="eventsPanel">加载中...</div>
  </div>

  <!-- Alerts bar -->
  <div id="alertsBar" class="fixed bottom-0 left-0 right-0 p-3 hidden"></div>
</div>
<script>
const API = '/api/v1/admin/dashboard';
let refreshTimer = null;

function toggleRefresh() {
  if (document.getElementById('autoRefresh').checked) { refreshTimer = setInterval(loadAll, 15000); }
  else { clearInterval(refreshTimer); }
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
}

async function loadAll() {
  try {
    const r = await fetch(API); const d = await r.json();
    document.getElementById('updateTime').textContent = new Date(d.generated_at).toLocaleString('zh-CN');
    renderOverview(d); renderKG(d); renderLLM(d); renderEvents(d.raw_events || {});
  } catch(e) { console.error(e); }
}

function statCard(label, value, color) {
  return '<div class="card text-center"><div class="text-xs text-gray-500">'+label+'</div><div class="text-2xl font-bold '+color+'">'+value+'</div></div>';
}

function renderOverview(d) {
  const h = d.health || {}, kg = d.kg || {}, cap = d.capacity_snapshot || {}, cont = d.continuation || {};
  document.getElementById('healthCards').innerHTML =
    statCard('系统健康', (h.status==='ok'?'✅':'⚠️'), '') +
    statCard('数据库', (h.db_counts?.sessions||0)+' 会话', 'text-blue-600') +
    statCard('消息总数', (cap.total_messages||0), 'text-indigo-600') +
    statCard('活跃会话', (cap.active_sessions||0), 'text-green-600');

  document.getElementById('quickStats').innerHTML =
    statCard('KG 成功', kg.kg_success||0, 'text-green-600') +
    statCard('KG 待处理', d.kg_ops?.pending_total||0, 'text-yellow-600') +
    statCard('KG 死信', d.kg_ops?.deadletter_total||0, 'text-red-600') +
    statCard('续跑待办', cont.pending||0, 'text-gray-600');

  document.getElementById('embeddingPanel').innerHTML = '<h3 class="font-semibold mb-2">嵌入模型</h3>' +
    '<div class="text-sm text-gray-600">模型: /models/stella | 维度: 1024 | 状态: <span class="text-green-600 font-bold">运行中</span></div>' +
    '<div class="mt-2 text-xs text-gray-400">向量搜索: pgvector <=> | 长度惩罚: >2000字符降权70%</div>';

  // Backfill progress
  fetch('/api/v1/search/weighted?query=health&limit=1').then(r=>r.json()).then(()=>{
    const embedded = cap.total_messages - (d.kg_ops?.pending_total || 0);
    const pct = cap.total_messages ? Math.round(embedded / cap.total_messages * 100) : 0;
    document.getElementById('backfillPanel').innerHTML = '<h3 class="font-semibold mb-2">嵌入背填进度</h3>' +
      '<div class="bg-gray-200 rounded-full h-4 mb-1"><div class="bar bg-green-500" style="width:'+pct+'%"></div></div>' +
      '<div class="text-xs text-gray-500">'+embedded+' / '+cap.total_messages+' ('+pct+'%)</div>';
  });
}

function renderKG(d) {
  const ops = d.kg_ops || {}, kg = d.kg || {};
  document.getElementById('kgStats').innerHTML =
    statCard('待处理', ops.pending_total||0, 'text-yellow-600') +
    statCard('运行中', ops.running_total||0, 'text-blue-600') +
    statCard('已完成', ops.succeeded_total||0, 'text-green-600') +
    statCard('死信', ops.deadletter_total||0, 'text-red-600');

  document.getElementById('kgActions').innerHTML = '<h3 class="font-semibold mb-2">运维操作</h3><div class="flex flex-wrap gap-2">' +
    ['run-kg-worker-once','requeue-kg-deadletters','repair-stuck-session','reconcile-continuation-metrics'].map(a =>
      '<button onclick="kgAction(\''+a+'\')" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 rounded-lg text-sm">'+a.replace(/-/g,' ')+'</button>'
    ).join('') + '</div><div id="kgActionResult" class="mt-2 text-xs text-gray-500"></div>';

  document.getElementById('kgQuality').innerHTML = '<h3 class="font-semibold mb-2">KG 质量</h3>' +
    '<div class="text-sm">成功: '+ (kg.kg_success||0) +' | JSON失败: '+ (kg.kg_fail_json_extract||0) +' | 限流: '+ (kg.kg_fail_429||0) + '</div>' +
    '<div class="mt-2"><div class="text-xs text-gray-500 mb-1">待处理原因</div>' +
    (ops.pending_reasons||[]).map(r=>'<span class="inline-block bg-yellow-50 text-yellow-700 px-2 py-1 rounded text-xs mr-1 mb-1">'+r.reason+': '+r.count+'</span>').join('') + '</div>';
}

function kgAction(action) {
  fetch('/api/v1/admin/ops/'+action, {method:'POST'}).then(r=>r.json()).then(j=>{
    document.getElementById('kgActionResult').textContent = JSON.stringify(j);
  });
}

function renderLLM(d) {
  const m = d.llm_route_metrics || {}, cfg = d.model_config || {};
  document.getElementById('llmPanels').innerHTML =
    '<div class="card"><h3 class="font-semibold mb-2">模型路由命中 (1h)</h3>' +
    Object.entries(m.window_hit_counts||{}).map(([k,v])=>'<div class="flex justify-between text-sm mb-1"><span class="truncate mr-2">'+k.substring(0,30)+'</span><span class="font-bold">'+(v||0)+'</span></div>').join('') +
    '<div class="text-xs text-gray-400 mt-2">命中: '+(m.hit_counts ? Object.values(m.hit_counts).reduce((a,b)=>a+b,0) : 0)+
    ' | 失败: '+(m.fail_counts ? Object.values(m.fail_counts).reduce((a,b)=>a+b,0) : 0)+
    ' | 降级: '+(m.fallback_counts ? Object.values(m.fallback_counts).reduce((a,b)=>a+b,0) : 0)+'</div></div>' +
    '<div class="card"><h3 class="font-semibold mb-2">当前模型配置</h3>' +
    ['openai_model','summary_model','backup_openai_model','llm_routing_mode'].map(k=>
      '<div class="text-sm mb-1"><span class="text-gray-500">'+k+':</span> '+(cfg[k]||'—')+'</div>'
    ).join('') + '</div>';
}

function renderEvents(ev) {
  document.getElementById('eventsPanel').innerHTML = '<h3 class="font-semibold mb-2">原始事件</h3>' +
    '<div class="text-sm">采集器: '+(ev.collector||'—')+' | 缓冲池: '+(ev.spool||'—')+' | 会话: '+(ev.sessions||'—')+'</div>' +
    '<div class="text-xs text-gray-400 mt-2">状态: '+(ev.status||'unknown')+'</div>';
}

function doSearch() {
  const q = document.getElementById('searchQuery').value;
  if(!q) return;
  fetch('/api/v1/search/weighted?query='+encodeURIComponent(q)+'&limit=5').then(r=>r.json()).then(hits=>{
    const el = document.getElementById('searchResults');
    if(!hits.length) { el.innerHTML='<div class="text-gray-400 text-sm">无结果</div>'; return; }
    el.innerHTML = hits.map(h=>'<div class="border-b py-2 text-sm"><div class="text-xs text-gray-400">得分: '+h.score.toFixed(3)+' | 角色: '+h.role+'</div><div class="text-gray-700 truncate">'+h.content.substring(0,100)+'</div></div>').join('');
  });
}

// Initial load
loadAll(); toggleRefresh();
</script>
</body></html>
