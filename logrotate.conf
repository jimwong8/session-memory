# Logrotate configuration for session-memory
# Run: sudo cp /home/jimwong/session-memory/logrotate.conf /etc/logrotate.d/session-memory

/home/jimwong/.cache/session-memory/plugin-auto-debug.log {
    daily
    rotate 3
    compress
    maxsize 100M
    missingok
    notifempty
    copytruncate
}

/home/jimwong/session-memory/logs/*.log {
    daily
    rotate 7
    compress
    missingok
    notifempty
    copytruncate
}
