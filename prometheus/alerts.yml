groups:
  - name: session_memory_alerts
    interval: 5m
    rules:
      # KG 积压告警
      - alert: KGJobsBacklogWarning
        expr: kg_jobs_pending > 500
        for: 1h
        labels:
          severity: warning
          component: kg_worker
        annotations:
          summary: 'KG jobs 积压超过 500'
          description: '当前积压 {{ $value }} 个任务，已持续 1 小时'
          
      - alert: KGJobsBacklogCritical
        expr: kg_jobs_pending > 2000
        for: 30m
        labels:
          severity: critical
          component: kg_worker
        annotations:
          summary: 'KG jobs 积压严重'
          description: '当前积压 {{ $value }} 个任务，超过 2000'
          
      # Pyramid Worker 监控
      - alert: PyramidWorkerStuck
        expr: rate(pyramid_atoms_processed_total[10m]) == 0
        for: 30m
        labels:
          severity: warning
          component: pyramid_worker
        annotations:
          summary: 'Pyramid Worker 可能卡死'
          description: '最近 10 分钟没有处理任何 atoms'
          
      # 数据库连接
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: 'PostgreSQL 连接失败'
          description: 'PostgreSQL 已离线超过 5 分钟'
          
      # Redis 连接
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 5m
        labels:
          severity: critical
          component: cache
        annotations:
          summary: 'Redis 连接失败'
          description: 'Redis 已离线超过 5 分钟'
